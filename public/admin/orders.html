<!DOCTYPE html>
<!-- จัดการคำสั่งซื้อ: กรองตามสถานะ ดูรายการ อัปเดตสถานะและเลขพัสดุ
     หน้านี้ถูกป้องกันโดย functions/admin/_middleware.js : ต้องมี cookie ks_admin (role = admin) เท่านั้น -->
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>คำสั่งซื้อ | K'Sante Admin</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
</head>
<body class="font-sans bg-canvas">
  <aside id="admin-nav" class="fixed inset-y-0 left-0 z-40 w-64 bg-ink text-white flex flex-col -translate-x-full lg:translate-x-0 transition-transform"></aside>
  <div class="lg:pl-64 min-h-screen flex flex-col">
    <header class="sticky top-0 z-30 h-16 bg-canvas/90 backdrop-blur border-b border-line flex items-center gap-3 px-4 sm:px-8">
      <button id="admin-menu" class="icon-btn lg:hidden" aria-label="เปิดเมนู"><span data-icon="menu"></span></button>
      <div><h1 class="font-display font-bold text-xl leading-tight">คำสั่งซื้อ</h1><p class="text-xs text-ink-soft">กรองตามสถานะ ดูรายละเอียด และอัปเดตการจัดส่ง</p></div>
      <div class="ml-auto flex items-center gap-2"></div>
    </header>
    <main id="main" class="flex-1 p-4 sm:p-8">

      <div id="status-tabs" class="flex gap-2 overflow-x-auto no-scrollbar pb-1"></div>
      <section class="card mt-4">
        <form id="search" class="p-4 flex gap-2 border-b border-line"><div class="relative flex-1"><span class="absolute left-3 top-3 text-ink-soft" data-icon="search" data-cls="w-4 h-4"></span>
          <input name="q" class="input pl-9" placeholder="ค้นหาเลขคำสั่งซื้อ ชื่อลูกค้า อีเมล เบอร์โทร หรือเลขพัสดุ" aria-label="ค้นหาคำสั่งซื้อ"></div><button class="btn btn-primary">ค้นหา</button></form>
        <div class="overflow-x-auto"><table class="w-full text-sm">
          <thead class="text-left text-xs text-ink-soft"><tr class="border-b border-line"><th class="p-3">เลขคำสั่งซื้อ</th><th class="p-3">ลูกค้า</th><th class="p-3">วันที่</th><th class="p-3">ชำระเงิน</th><th class="p-3 text-right">ยอดรวม</th><th class="p-3">สถานะ</th><th class="p-3">เลขพัสดุ</th></tr></thead>
          <tbody id="rows" class="divide-y divide-line"></tbody></table></div>
        <div id="pager" class="p-4 flex items-center justify-between text-sm border-t border-line"></div>
      </section>
      <div id="drawer" class="fixed inset-0 z-50" hidden>
        <div class="absolute inset-0 bg-ink/40" data-close></div>
        <aside class="absolute right-0 top-0 h-full w-full max-w-xl bg-canvas overflow-y-auto border-l-2 border-ink modal-panel" role="dialog" aria-modal="true" aria-label="รายละเอียดคำสั่งซื้อ"><div id="detail"></div></aside>
      </div>
    </main>
  </div>
  <script src="/js/config.js" defer></script>
  <script src="/js/icons.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/admin/admin.js" defer></script>
  <script src="/js/admin/orders.js" defer></script>
</body>
</html>
