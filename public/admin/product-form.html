<!DOCTYPE html>
<!-- ฟอร์มเพิ่ม/แก้ไขสินค้า พร้อมตัวเลือกสี x ขนาด และสต็อก
     หน้านี้ถูกป้องกันโดย functions/admin/_middleware.js : ต้องมี cookie ks_admin (role = admin) เท่านั้น -->
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ฟอร์มสินค้า | K'Sante Admin</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
</head>
<body class="font-sans bg-canvas">
  <aside id="admin-nav" class="fixed inset-y-0 left-0 z-40 w-64 bg-ink text-white flex flex-col -translate-x-full lg:translate-x-0 transition-transform"></aside>
  <div class="lg:pl-64 min-h-screen flex flex-col">
    <header class="sticky top-0 z-30 h-16 bg-canvas/90 backdrop-blur border-b border-line flex items-center gap-3 px-4 sm:px-8">
      <button id="admin-menu" class="icon-btn lg:hidden" aria-label="เปิดเมนู"><span data-icon="menu"></span></button>
      <div><h1 class="font-display font-bold text-xl leading-tight"><span id="form-title">เพิ่มสินค้า</span></h1><p class="text-xs text-ink-soft">ข้อมูลสินค้า รูปภาพ และสต็อกแยกตามสีและขนาด</p></div>
      <div class="ml-auto flex items-center gap-2"></div>
    </header>
    <main id="main" class="flex-1 p-4 sm:p-8">

      <form id="product-form" class="grid xl:grid-cols-[1fr_340px] gap-4 items-start" novalidate>
        <div class="space-y-4">
          <section class="card p-5 grid sm:grid-cols-2 gap-4">
            <div class="sm:col-span-2"><label class="label" for="name">ชื่อสินค้า *</label><input class="input" id="name" name="name" required maxlength="120"></div>
            <div><label class="label" for="category_id">หมวดหมู่ *</label><select class="input" id="category_id" name="category_id" required></select></div>
            <div><label class="label" for="base_price">ราคา (บาท) *</label><input class="input" id="base_price" name="base_price" type="number" min="0" step="1" required></div>
            <div><label class="label" for="slug">Slug (URL)</label><input class="input" id="slug" name="slug" maxlength="120" placeholder="สร้างจากชื่ออัตโนมัติถ้าเว้นว่าง"></div>
            <div><label class="label" for="material">วัสดุ / เนื้อผ้า</label><input class="input" id="material" name="material" maxlength="120"></div>
            <div class="sm:col-span-2"><label class="label" for="description">รายละเอียดสินค้า</label><textarea class="input" id="description" name="description" rows="4" maxlength="3000"></textarea></div>
          </section>
          <section class="card p-5">
            <div class="flex flex-wrap items-center justify-between gap-2"><h2 class="font-bold">ตัวเลือกสี × ขนาด และสต็อก</h2>
              <div class="flex gap-2"><button type="button" id="add-variant" class="btn btn-outline btn-sm"><span data-icon="plus" data-cls="w-4 h-4"></span> เพิ่มแถว</button>
              <button type="button" id="gen-variants" class="btn btn-ghost btn-sm border border-line"><span data-icon="sparkles" data-cls="w-4 h-4"></span> สร้างสีใหม่ครบ 4 ไซซ์</button></div></div>
            <div class="overflow-x-auto mt-3"><table class="w-full text-sm min-w-[760px]">
              <thead class="text-left text-xs text-ink-soft"><tr><th class="p-2">สี</th><th class="p-2">Hex</th><th class="p-2">ไซซ์</th><th class="p-2">SKU (เว้นว่าง = อัตโนมัติ)</th><th class="p-2">สต็อก</th><th class="p-2">URL รูปของสีนี้</th><th class="p-2"></th></tr></thead>
              <tbody id="variants"></tbody></table></div>
            <p class="text-xs text-ink-soft mt-2">แถวที่ลบออกแล้วกดบันทึก จะถูกลบจากฐานข้อมูล (ประวัติออเดอร์เดิมยังอยู่ครบ)</p>
          </section>
        </div>
        <aside class="space-y-4 xl:sticky xl:top-24">
          <section class="card p-5">
            <label class="label" for="image_url">URL รูปภาพหลัก *</label><input class="input" id="image_url" name="image_url" required placeholder="https://images.unsplash.com/...">
            <div class="mt-3 aspect-square rounded-xl overflow-hidden bg-mist border border-line"><img id="preview" class="w-full h-full object-cover" alt="ตัวอย่างรูปสินค้า" src="/img/hat-fallback.svg" onerror="this.src='/img/hat-fallback.svg'"></div>
            <label class="flex items-center justify-between gap-3 mt-4 text-sm font-bold cursor-pointer">เปิดขายบนหน้าร้าน<span class="switch"><input type="checkbox" name="is_active" checked><span></span></span></label>
          </section>
          <section class="card p-5 space-y-3">
            <p class="text-sm"><span class="text-ink-soft">สต็อกรวม:</span> <b id="total-stock" class="tabular">0</b> ชิ้น</p>
            <div id="form-error" class="rounded-xl bg-danger-soft text-danger text-sm font-semibold p-3 flex gap-2" hidden></div>
            <button class="btn btn-primary w-full" id="save"><span data-icon="save" data-cls="w-4 h-4"></span> บันทึกสินค้า</button>
            <a href="/admin/products" class="btn btn-ghost w-full border border-line">ยกเลิก</a>
            <button type="button" id="delete" class="btn btn-ghost w-full text-danger" hidden><span data-icon="trash2" data-cls="w-4 h-4"></span> ลบสินค้านี้</button>
          </section>
        </aside>
      </form>
    </main>
  </div>
  <script src="/js/config.js" defer></script>
  <script src="/js/icons.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/admin/admin.js" defer></script>
  <script src="/js/admin/product-form.js" defer></script>
</body>
</html>
