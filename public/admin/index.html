<!DOCTYPE html>
<!-- Admin Dashboard: ยอดขาย, จำนวนออเดอร์, สินค้า, สต็อกต่ำ
     หน้านี้ถูกป้องกันโดย functions/admin/_middleware.js : ต้องมี cookie ks_admin (role = admin) เท่านั้น -->
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard | K'Sante Admin</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
</head>
<body class="font-sans bg-canvas">
  <aside id="admin-nav" class="fixed inset-y-0 left-0 z-40 w-64 bg-ink text-white flex flex-col -translate-x-full lg:translate-x-0 transition-transform"></aside>
  <div class="lg:pl-64 min-h-screen flex flex-col">
    <header class="sticky top-0 z-30 h-16 bg-canvas/90 backdrop-blur border-b border-line flex items-center gap-3 px-4 sm:px-8">
      <button id="admin-menu" class="icon-btn lg:hidden" aria-label="เปิดเมนู"><span data-icon="menu"></span></button>
      <div><h1 class="font-display font-bold text-xl leading-tight">Dashboard</h1><p class="text-xs text-ink-soft">ภาพรวมร้าน K'Sante</p></div>
      <div class="ml-auto flex items-center gap-2"></div>
    </header>
    <main id="main" class="flex-1 p-4 sm:p-8">

      <div id="kpis" class="grid grid-cols-2 xl:grid-cols-4 gap-4">
        <div class="card h-32 skeleton"></div><div class="card h-32 skeleton"></div><div class="card h-32 skeleton"></div><div class="card h-32 skeleton"></div></div>
      <div class="grid xl:grid-cols-3 gap-4 mt-4">
        <section class="card p-5 xl:col-span-2"><div class="flex items-center justify-between"><h2 class="font-bold">ยอดขาย 14 วันล่าสุด</h2><span class="text-xs text-ink-soft">ไม่รวมออเดอร์ที่ยกเลิก</span></div>
          <div id="chart" class="mt-4 h-56"></div></section>
        <section class="card p-5"><h2 class="font-bold">ออเดอร์ตามสถานะ</h2><div id="by-status" class="mt-4 space-y-3"></div></section>
      </div>
      <div class="grid xl:grid-cols-3 gap-4 mt-4">
        <section class="card p-5 xl:col-span-2"><div class="flex items-center justify-between"><h2 class="font-bold">คำสั่งซื้อล่าสุด</h2><a href="/admin/orders" class="link text-xs">ดูทั้งหมด</a></div>
          <div class="overflow-x-auto mt-3"><table class="w-full text-sm"><tbody id="recent" class="divide-y divide-line"></tbody></table></div></section>
        <section class="card p-5"><div class="flex items-center justify-between"><h2 class="font-bold flex items-center gap-2"><span data-icon="triangle-alert" data-cls="w-4 h-4 text-mustard"></span> สต็อกต่ำ (≤ 5)</h2>
          <a href="/admin/inventory?filter=low" class="link text-xs">จัดการสต็อก</a></div><ul id="low" class="mt-3 divide-y divide-line text-sm"></ul></section>
      </div>
      <div class="grid md:grid-cols-2 gap-4 mt-4">
        <section class="card p-5"><h2 class="font-bold">สินค้าขายดี</h2><ol id="top" class="mt-3 space-y-2 text-sm"></ol></section>
        <section class="card p-5"><h2 class="font-bold">ผู้เข้าชม & PDPA (7 วัน)</h2><div id="traffic" class="mt-3 grid grid-cols-3 gap-3 text-center"></div>
          <p class="text-xs text-ink-soft mt-3">นับเฉพาะผู้ที่ยอมรับคุกกี้ Analytics ตามนโยบายคุกกี้</p></section>
      </div>
    </main>
  </div>
  <script src="/js/config.js" defer></script>
  <script src="/js/icons.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/admin/admin.js" defer></script>
  <script src="/js/admin/dashboard.js" defer></script>
</body>
</html>
