<!DOCTYPE html>
<!-- จัดการสินค้า (CRUD) และหมวดหมู่
     หน้านี้ถูกป้องกันโดย functions/admin/_middleware.js : ต้องมี cookie ks_admin (role = admin) เท่านั้น -->
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>สินค้า | K'Sante Admin</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
</head>
<body class="font-sans bg-canvas">
  <aside id="admin-nav" class="fixed inset-y-0 left-0 z-40 w-64 bg-ink text-white flex flex-col -translate-x-full lg:translate-x-0 transition-transform"></aside>
  <div class="lg:pl-64 min-h-screen flex flex-col">
    <header class="sticky top-0 z-30 h-16 bg-canvas/90 backdrop-blur border-b border-line flex items-center gap-3 px-4 sm:px-8">
      <button id="admin-menu" class="icon-btn lg:hidden" aria-label="เปิดเมนู"><span data-icon="menu"></span></button>
      <div><h1 class="font-display font-bold text-xl leading-tight">สินค้า</h1><p class="text-xs text-ink-soft">เพิ่ม แก้ไข ลบสินค้าและหมวดหมู่</p></div>
      <div class="ml-auto flex items-center gap-2"><a href="/admin/product-form" class="btn btn-tangerine btn-sm"><span data-icon="plus" data-cls="w-4 h-4"></span> เพิ่มสินค้า</a></div>
    </header>
    <main id="main" class="flex-1 p-4 sm:p-8">

      <div class="grid xl:grid-cols-[1fr_300px] gap-4 items-start">
        <section class="card">
          <div class="p-4 flex flex-wrap gap-2 border-b border-line">
            <div class="relative flex-1 min-w-48"><span class="absolute left-3 top-3 text-ink-soft" data-icon="search" data-cls="w-4 h-4"></span>
              <input id="q" class="input pl-9" placeholder="ค้นหาชื่อสินค้า หรือ slug" aria-label="ค้นหาสินค้า"></div>
            <select id="cat-filter" class="input w-auto" aria-label="กรองตามหมวดหมู่"><option value="">ทุกหมวดหมู่</option></select>
          </div>
          <div class="overflow-x-auto"><table class="w-full text-sm">
            <thead class="text-left text-xs text-ink-soft"><tr class="border-b border-line"><th class="p-3">สินค้า</th><th class="p-3">หมวดหมู่</th><th class="p-3 text-right">ราคา</th><th class="p-3">สต็อกรวม</th><th class="p-3">ตัวเลือก</th><th class="p-3">สถานะ</th><th class="p-3"></th></tr></thead>
            <tbody id="rows" class="divide-y divide-line"></tbody></table></div>
        </section>
        <section class="card p-5">
          <h2 class="font-bold flex items-center gap-2"><span data-icon="layers" data-cls="w-4 h-4"></span> หมวดหมู่</h2>
          <ul id="cats" class="mt-3 divide-y divide-line text-sm"></ul>
          <form id="cat-form" class="mt-4 flex gap-2"><input name="name" class="input h-10" placeholder="ชื่อหมวดหมู่ใหม่" required maxlength="60" aria-label="ชื่อหมวดหมู่ใหม่"><button class="btn btn-primary btn-sm h-10">เพิ่ม</button></form>
        </section>
      </div>
    </main>
  </div>
  <script src="/js/config.js" defer></script>
  <script src="/js/icons.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/admin/admin.js" defer></script>
  <script src="/js/admin/products.js" defer></script>
</body>
</html>
