<!DOCTYPE html>
<!-- จัดการสต็อกแยกตามสีและขนาด พร้อมแถบสีเตือนของใกล้หมด
     หน้านี้ถูกป้องกันโดย functions/admin/_middleware.js : ต้องมี cookie ks_admin (role = admin) เท่านั้น -->
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>สต็อกสินค้า | K'Sante Admin</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
</head>
<body class="font-sans bg-canvas">
  <aside id="admin-nav" class="fixed inset-y-0 left-0 z-40 w-64 bg-ink text-white flex flex-col -translate-x-full lg:translate-x-0 transition-transform"></aside>
  <div class="lg:pl-64 min-h-screen flex flex-col">
    <header class="sticky top-0 z-30 h-16 bg-canvas/90 backdrop-blur border-b border-line flex items-center gap-3 px-4 sm:px-8">
      <button id="admin-menu" class="icon-btn lg:hidden" aria-label="เปิดเมนู"><span data-icon="menu"></span></button>
      <div><h1 class="font-display font-bold text-xl leading-tight">สต็อกสินค้า</h1><p class="text-xs text-ink-soft">แก้จำนวนได้หลายแถวพร้อมกันแล้วกดบันทึก</p></div>
      <div class="ml-auto flex items-center gap-2"></div>
    </header>
    <main id="main" class="flex-1 p-4 sm:p-8">

      <div id="summary" class="grid grid-cols-2 lg:grid-cols-4 gap-4"></div>
      <section class="card mt-4">
        <div class="p-4 flex flex-wrap gap-2 items-center border-b border-line">
          <div class="flex gap-2" id="filter-tabs">
            <button class="chip chip-on" data-filter="">ทั้งหมด</button><button class="chip" data-filter="low"><span class="w-2 h-2 rounded-full bg-mustard"></span> ใกล้หมด (1-5)</button>
            <button class="chip" data-filter="out"><span class="w-2 h-2 rounded-full bg-danger"></span> หมด</button></div>
          <div class="relative flex-1 min-w-48"><span class="absolute left-3 top-3 text-ink-soft" data-icon="search" data-cls="w-4 h-4"></span>
            <input id="q" class="input pl-9" placeholder="ค้นหาสินค้า SKU หรือสี" aria-label="ค้นหาสต็อก"></div>
        </div>
        <div class="overflow-x-auto"><table class="w-full text-sm">
          <thead class="text-left text-xs text-ink-soft"><tr class="border-b border-line"><th class="p-3">สินค้า</th><th class="p-3">สี / ไซซ์</th><th class="p-3">SKU</th><th class="p-3">ระดับสต็อก</th><th class="p-3">จำนวน</th><th class="p-3">ปรับเร็ว</th></tr></thead>
          <tbody id="rows" class="divide-y divide-line"></tbody></table></div>
      </section>
      <div id="savebar" class="fixed bottom-4 left-4 right-4 lg:left-72 z-40 card-block p-3 flex items-center gap-3" hidden>
        <span class="text-sm font-bold flex-1" id="dirty-count"></span>
        <button id="discard" class="btn btn-ghost btn-sm border border-line">ยกเลิก</button>
        <button id="save" class="btn btn-primary btn-sm"><span data-icon="save" data-cls="w-4 h-4"></span> บันทึก<span class="hidden sm:inline">การเปลี่ยนแปลง</span></button>
      </div>
    </main>
  </div>
  <script src="/js/config.js" defer></script>
  <script src="/js/icons.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script src="/js/admin/admin.js" defer></script>
  <script src="/js/admin/inventory.js" defer></script>
</body>
</html>
